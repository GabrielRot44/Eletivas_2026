<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Exercício 5</title>
    <style> 
        label{
            font-weight: bold;
        }
        ::placeholder {
            color: #999;
        }
    </style>
</head>
<body class="m-3">

    <h1>Billing address</h1>
<form method="post">
            <div class="row inline-row mb-3"><div class="col-md-6">
              <label for="firstName" class="form-label">First name</label>
              <input type="text" id="firstName" name="firstName" class="form-control" required="">
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last name</label>
              <input type="text" id="lastName" name="lastName" class="form-control" required="">
            </div></div>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text">@</span>
              <input type="text" class="form-control" id="username" placeholder="Username">
            </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email <span class="text-muted">(Optional)</span></label>
              <input type="email" id="email" name="email" class="form-control" placeholder="you@exemple.com">
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <input type="text" id="address" name="address" class="form-control" placeholder="1234 Main St" required="">
            </div>
            <div class="mb-3">
              <label for="address2" class="form-label">Address 2 <span class="text-muted">(Optional)</span></label>
              <input type="text" id="address2" name="address2" class="form-control" placeholder="Apartment or suite">
            </div>
            <div class="row inline-row mb-3"><div class="col-md-6">
              <label for="country" class="form-label">Country</label>
              <select name="country" id="country" class="form-select" required="">
                <option value="">Choose...</option>
              </select>
            </div> 
            <div class="col-md-3">
              <label for="state" class="form-label">State</label>
                <select id="state" name="state" class="form-select" required="">
                    <option value="">Choose...</option>
                </select>
            </div>
            <div class="col-md-3">
              <label for="zip" class="form-label">Zip</label>
              <select name="zip" id="zip" class="form-select" required="">
                <option value="">Choose...</option>
              </select>
            </div>
            </div>
</form>

</body>
</html>
