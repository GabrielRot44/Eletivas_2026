<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Exercício 3</title>
    
</head>
<body class="m-3">

    <h1 class="text-center">Sample Form</h1>
    
    <form method="post " >
    <table class="table text-end">
        <tr>
            <td class="col-2"><label for="name" class="form-label">Partner Name</label></td>
            <td class="col-4"><input type="text" id="name" name="name" class="form-control" required="" ></td>
            <td class="col-2"><label for="email" class="form-label">Partner Email ID</label></td>
            <td class="col-4"><input type="text" id="email" name="email" class="form-control" required=""></td>
        </tr>
        <tr>
            <td class="col-2"><label for="legalName" class="form-label">Partner Legal Name</label></td>
            <td class="col-4"><input type="text" id="legalName" name="legalName" class="form-control" required=""></td>
            <td class="col-2"><label for="contactNumber" class="form-label">Partner Mobile</label></td>
            <td class="col-4"><input type="text" id="contactNumber" name="contactNumber" class="form-control" required=""></td>
        </tr>
        <tr>
            <td><label for="address" class="form-label">Partner Address</label></td>
            <td colspan="3"><textarea id="address" name="address" class="form-control" rows="4" required=""></textarea></td>
        </tr>
        <tr>
            <td></td>
        </tr>
    </table>
    <button type="submit" class="btn btn-primary col-1 m-3">Enviar</button>
    </form>
    

</body>
</html>
