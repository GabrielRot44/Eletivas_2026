<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Exercício 1</title>
    
</head>
<body>
    
<form method="post" class="m-3">
    <h1>Formulário 1</h1> 
<div class="row inline-row mb-3">


        <div class="col-md-4">
              <label for="name" class="form-label">First name</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="Mark" required="" >
            </div>
        <div class="col-md-4">
              <label for="name2" class="form-label">Last name</label>
              <input type="text" id="name2" name="name2" class="form-control" placeholder="Otto" required="">
            </div>
        <div class="col-md-4">
              <label for="username" class="form-label"></label>Username</label>
              <div class="input-group"> 
                    <span class="input-group-text">@</span>
              <input type="email" id="username" name="username" class="form-control"  placeholder="username" required="">
            </div></div></div>
        
        <div class="row mb-3">    
            <div class="col-md-6">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" name="city" class="form-control" placeholder="" required>
            </div>

            <div class="col-md-3">
                <label for="state" class="form-label">State</label>
                <input type="text" id="state" name="state" class="form-control" placeholder="" required>
            </div>

            <div class="col-md-3">
                <label for="zip" class="form-label">Zip</label>
                <input type="text" id="zip" name="zip" class="form-control" placeholder=""  required>
            </div></div>


        <div class="mb-3">
              <div class="form-check ">
                <input type="checkbox" id="terms_of_conditions" name="terms_of_conditions" class="form-check-input">
                <label for="terms_of_conditions" class="form-check-label">Agree to terms and conditions</label>
              </div>
            </div>

<button type="submit" class="btn btn-primary">Submit form</button>

</form>
</body>
</html>
