<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Exercício 4</title>
    <style> 
        label{
            font-weight: bold;
        }
        ::placeholder {
            color: #999;
        }
    </style>
</head>
<body class="m-3">
    
    <h1>Novo Usuário</h1>
    <form method="post">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Informe o nome" class="form-control" required="">
        </div>
        <div class="row inline-row mb-3"><div class="col-md-3">
            <label for="cpf" class="form-label">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="Informe o CPF" class="form-control" required="">
        </div>
        <div class="col-md-6">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Informe o endereço" class="form-control" required="">
        </div>
        <div class="col-md-3">
            <label for="nivel" class="form-label">Nível</label>
            <select id="nivel" name="nivel" class="form-select" required="">
                <option value="---">---</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Email:</label>
            <input type="text" id="email" name="email" placeholder="Informe o email" class="form-control" required="">
        </div>
        <div class="col-md-3">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Informe a senha" class="form-control" required="">
        </div>
        <div class="col-md-3">
            <label for="status" class="form-label">Status:</label>
            <select id="status" name="status" class="form-select" required="">
                <option value="---">---</option>
            </select>
        </div>
        </div>
        <div class="text-end">
            <button type="submit" class="btn btn-success">Enviar</button>
            <button type="reset" class="btn btn-body border">Cancelar</button>
        </div>
    </form>

</body>
</html>
