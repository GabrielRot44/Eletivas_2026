<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Exercício 2</title>
    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
        }
        input[type=number] {
        -moz-appearance: textfield;
        }
        .cinza-escuro {
        background-color: #cacaca;
        }
        label{
        font-weight: bold;
        }
    </style>
</head>
<body class="m-3">
    <h1>Form2</h1>
<form method="post">
    <div class="row inline-row mb-3 ">
        <div class="col-md-1">
            <label for="codigo" class="form-label">Código</label>
            <input type="number" id="codigo" name="codigo" placeholder="32" class="form-control rounded-0 text-center cinza-escuro" required="">
        </div>
        <div class="col-md-6">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Nome completo do cliente" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" id="email" name="email" placeholder="cliente@dominio.com" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-2">
            <label for="cpf" class="form-label">CPF</label>
            <input type="number" id="cpf" name="cpf" placeholder="Só números" class="form-control rounded-0" required="">
        </div>


        <div class="col-md-2">
            <label for="celular" class="form-label">Nº Celular</label>
            <input type="text" id="celular" name="celular" placeholder="Nº do celular" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-2">
            <label for="telefoneFixo" class="form-label">Nº Telefone fixo</label>
            <input type="text" id="telefoneFixo" name="telefoneFixo" placeholder="Nº do telefone" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-2">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="ex:88308070" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-2">
            <label for="logradouro" class="form-label">Logradouro</label>
            <input type="text" id="logradouro" name="logradouro" placeholder="ex:Rua 1400," class="form-control rounded-0" required="">
        </div>
        <div class="col-md-1">
            <label for="numero" class="form-label">Nº</label>
            <input type="number" id="numero" name="numero" placeholder="Nº" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-3">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" id="bairro" name="bairro" placeholder="Bairro" class="form-control rounded-0" required="">
        </div>


        <div class="col-md-3">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-1">
            <label for="uf" class="form-label">UF</label>
            <input type="text" id="uf" name="uf" placeholder="UF" class="form-control rounded-0" required="">
        </div>
        <div class="col-md-2">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select rounded-0" required="">
                <option value="">Selecione</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
        </div>
    </div>
    <div class="text-end">
        <button type="reset" class="btn btn-danger rounded-0 w-10">Resetar</button>
        <button type="submit" class="btn btn-success rounded-0 w-10">Próximo</button>
    </div>
</form>
</body>
</html>
